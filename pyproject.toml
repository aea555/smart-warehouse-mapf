[project]
name = "warehouse-mapf"
version = "0.1.0"
description = "Multi-Agent Smart Warehouse Simulator — BLM5026 dönem projesi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
